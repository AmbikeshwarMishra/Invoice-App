<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Welcome - SM SERVICES</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #0B132B; color: #E0E1DD; height: 100vh; display: flex; align-items: center; justify-content: center; margin: 0; }
        .top-corner-nav { position: absolute; top: 25px; right: 35px; }
        .btn-neon { background-color: #00F5D4; color: #0B132B; font-weight: 700; border-radius: 30px; padding: 10px 28px; text-decoration: none; box-shadow: 0 0 15px rgba(0, 245, 212, 0.4); transition: 0.3s; }
        .btn-neon:hover { background-color: #00BBF9; color: #0B132B; box-shadow: 0 0 25px rgba(0, 187, 249, 0.6); }
        .brand-title { font-size: 3.8rem; font-weight: 800; color: #00F5D4; letter-spacing: 2px; }
        .brand-subtitle { color: #90E0EF; font-size: 1.25rem; letter-spacing: 1px; }
    </style>
</head>
<body>
    <div class="top-corner-nav">
        <a href="/login" class="btn-neon">Portal Login</a>
    </div>

    <div class="text-center">
        <img src="/static/images/logo.png" alt="SM Services Logo" style="max-width: 300px;" class="mb-4">
        <h1 class="brand-title">SM SERVICES</h1>
        <p class="brand-subtitle">Smart Billing, Scan OCR & Automated Invoice Suite</p>
    </div>
</body>
</html>
